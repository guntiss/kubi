name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx @vscode/vsce package --out kubi.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: kubi-vsix
          path: kubi.vsix
